name: Backend
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-bookworm
        env:
          POSTGRES_USER: incubadora
          POSTGRES_PASSWORD: testing-only
          POSTGRES_DB: incubadora_test
        ports: [5432:5432]
        options: >-
          --health-cmd "pg_isready -U incubadora -d incubadora_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DB_HOST: 127.0.0.1
      DB_PORT: 5432
      DB_USERNAME: incubadora
      DB_PASSWORD: testing-only
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: pdo_pgsql, pdo_sqlite, mbstring
          coverage: none
      - run: composer install --no-interaction --prefer-dist
      - run: cp .env.example .env
      - run: php artisan key:generate
      - run: vendor/bin/pint --test
      - run: vendor/bin/phpunit -c phpunit.pgsql.xml
