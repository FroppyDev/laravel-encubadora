
name: incubadora-fic

services:
  app:
    build: .
    ports:
      - "127.0.0.1:${APP_PORT:-8000}:8000"
    volumes:
      - .:/app
      - vendor:/app/vendor
    environment:
      DB_CONNECTION: pgsql
      DB_HOST: db
      DB_PORT: 5432
      DB_DATABASE: ${DB_DATABASE:-incubadora}
      DB_USERNAME: ${DB_USERNAME:-incubadora}
      DB_PASSWORD: ${DB_PASSWORD:-local-only-password}

      MONGODB_URI: mongodb://${MONGO_ROOT_USERNAME}:${MONGO_ROOT_PASSWORD}@mongo:27017/?authSource=admin
      MONGODB_DATABASE: ${MONGODB_DATABASE:-incubadora_media}

      MAIL_MAILER: smtp
      MAIL_HOST: ${DOCKER_MAIL_HOST:-mailpit}
      MAIL_PORT: ${DOCKER_MAIL_PORT:-1025}

    depends_on:
      db:
        condition: service_healthy
      mongo:
        condition: service_healthy
      mailpit:
        condition: service_started

  db:
    image: postgres:17-bookworm
    environment:
      POSTGRES_DB: ${DB_DATABASE:-incubadora}
      POSTGRES_USER: ${DB_USERNAME:-incubadora}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-local-only-password}
    ports:
      - "127.0.0.1:${DB_FORWARD_PORT:-5433}:5432"
    volumes:
      - postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 12

  mongo:
    image: mongo:8.0
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_ROOT_USERNAME}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD}
    volumes:
      - mongodb:/data/db
    ports:
      - "127.0.0.1:27017:27017"
    healthcheck:
      test:
        [
          "CMD",
          "mongosh",
          "--quiet",
          "--eval",
          "db.adminCommand('ping').ok"
        ]
      interval: 5s
      timeout: 5s
      retries: 12

  mailpit:
    image: axllent/mailpit:v1.27
    ports:
      - "127.0.0.1:8025:8025"

volumes:
  postgres:
  mongodb:
  vendor:
