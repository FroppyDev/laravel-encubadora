name: incubadora-fic
services:
  app:
    build: .
    ports:
      - "127.0.0.1:${APP_PORT:-8000}:8000"
    volumes:
      - .:/app
      - vendor:/app/vendor
    environment:
      DB_CONNECTION: pgsql
      DB_HOST: db
      DB_PORT: 5432
      DB_DATABASE: ${DB_DATABASE:-incubadora}
      DB_USERNAME: ${DB_USERNAME:-incubadora}
      DB_PASSWORD: ${DB_PASSWORD:-local-only-password}
      MAIL_MAILER: smtp
      MAIL_HOST: mailpit
      MAIL_PORT: 1025
    depends_on:
      db:
        condition: service_healthy
      mailpit:
        condition: service_started
  db:
    image: postgres:17-bookworm
    environment:
      POSTGRES_DB: ${DB_DATABASE:-incubadora}
      POSTGRES_USER: ${DB_USERNAME:-incubadora}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-local-only-password}
    ports:
      - "127.0.0.1:${DB_FORWARD_PORT:-5433}:5432"
    volumes:
      - postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 12
  mailpit:
    image: axllent/mailpit:v1.27
    ports:
      - "127.0.0.1:8025:8025"
volumes:
  postgres:
  vendor:
